services:
    app:
        build: .
        image: ecommerce-api
        container_name: ecommerce-api
        ports:
            - "${APP_PORT:-8080}:80"
        environment:
            APP_NAME: "E-Commerce API"
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: "http://localhost:${APP_PORT:-8080}"
            APP_KEY: "${APP_KEY:-}"
            JWT_SECRET: "${JWT_SECRET:-}"
            JWT_TTL: 60
            LOG_CHANNEL: stderr
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ecommerce
            DB_USERNAME: ecommerce
            DB_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            INVENTORY_GRPC_TARGET: "${INVENTORY_GRPC_TARGET:-host.docker.internal:50051}"
            CACHE_DRIVER: database
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            FILESYSTEM_DISK: local
            SEED_DEMO_DATA: "true"
            # Order emails: values come from the shell or the project .env file.
            MAIL_MAILER: "${MAIL_MAILER:-log}"
            MAIL_HOST: "${MAIL_HOST:-}"
            MAIL_PORT: "${MAIL_PORT:-587}"
            MAIL_USERNAME: "${MAIL_USERNAME:-}"
            MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
            MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
            MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.test}"
            MAIL_FROM_NAME: "E-Commerce Platform"
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: "${RABBITMQ_USER:-ecommerce}"
            RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-ecommerce-local-pass}"
            PUSHER_APP_ID: "${PUSHER_APP_ID:-ecommerce-app}"
            PUSHER_APP_KEY: "${PUSHER_APP_KEY:-ecommerce-key}"
            PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-ecommerce-secret}"
            PUSHER_APP_CLUSTER: mt1
            PUSHER_HOST: soketi
            PUSHER_PORT: 6001
            PUSHER_SCHEME: http
        volumes:
            - app-storage:/var/www/html/storage/app
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: mysql:8.0
        container_name: ecommerce-db
        environment:
            MYSQL_DATABASE: ecommerce
            MYSQL_USER: ecommerce
            MYSQL_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-ecommerce-root-pass}"
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-ecommerce-root-pass}"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: ecommerce-redis
        ports:
            - "6380:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4-management
        container_name: ecommerce-rabbitmq
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-ecommerce}"
            RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-ecommerce-local-pass}"
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10
        restart: unless-stopped

    soketi:
        image: quay.io/soketi/soketi:latest-16-alpine
        container_name: ecommerce-soketi
        environment:
            SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-ecommerce-app}"
            SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-ecommerce-key}"
            SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-ecommerce-secret}"
        ports:
            - "6001:6001"
        restart: unless-stopped

volumes:
    db-data:
    app-storage:
    rabbitmq-data:
