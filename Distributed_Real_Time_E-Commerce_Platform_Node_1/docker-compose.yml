x-mail-env: &mail-env
    MAIL_MAILER: "${MAIL_MAILER:-log}"
    MAIL_HOST: "${MAIL_HOST:-}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.test}"
    MAIL_FROM_NAME: "E-Commerce Platform"

x-rabbitmq-env: &rabbitmq-env
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: "${RABBITMQ_USER:-ecommerce}"
    RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-ecommerce-local-pass}"

services:
    app1: &app
        build: .
        image: ecommerce-api
        container_name: ecommerce-api-1
        environment:
            APP_NAME: "E-Commerce API"
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: "http://localhost:${APP_PORT:-8080}"
            APP_KEY: "${APP_KEY:-}"
            JWT_SECRET: "${JWT_SECRET:-}"
            JWT_TTL: 60
            LOG_CHANNEL: stderr
            DB_CONNECTION: mysql
            DB_HOST: mysql-primary
            DB_PORT: 3306
            DB_READ_HOST: mysql-replica
            DB_READ_PORT: 3306
            DB_WRITE_HOST: mysql-primary
            DB_WRITE_PORT: 3306
            DB_DATABASE: ecommerce
            DB_USERNAME: ecommerce
            DB_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            INVENTORY_GRPC_TARGET: "host.docker.internal:50051"
            CACHE_DRIVER: redis
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            FILESYSTEM_DISK: local
            SEED_DEMO_DATA: "true"
            BROADCAST_DRIVER: pusher
            # Order emails: values come from the shell or the project .env file.
            <<: [*mail-env, *rabbitmq-env]
            PUSHER_APP_ID: "${PUSHER_APP_ID:-ecommerce-app}"
            PUSHER_APP_KEY: "${PUSHER_APP_KEY:-ecommerce-key}"
            PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-ecommerce-secret}"
            PUSHER_APP_CLUSTER: mt1
            PUSHER_HOST: soketi
            PUSHER_PORT: 6001
            PUSHER_SCHEME: http
        volumes:
            - app-storage:/var/www/html/storage/app
        depends_on:
            mysql-primary:
                condition: service_healthy
            mysql-replica:
                condition: service_healthy
        restart: unless-stopped
    app2:
        <<: *app
        container_name: ecommerce-api-2
    app3:
        <<: *app
        container_name: ecommerce-api-3

    nginx:
        image: nginx:1.27-alpine
        container_name: ecommerce-nginx
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - app1
            - app2
            - app3
        restart: unless-stopped
    mysql-primary:
        image: mysql:8.0
        container_name: ecommerce-db-primary
        command: >
            --server-id=1
            --log-bin=mysql-bin
            --gtid-mode=ON
            --enforce-gtid-consistency=ON
        environment:
            MYSQL_DATABASE: ecommerce
            MYSQL_USER: ecommerce
            MYSQL_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-ecommerce-root-pass}"
            MYSQL_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:-ecommerce-replica-pass}"
        ports:
            - "${DB_PRIMARY_PORT:-3308}:3306"
        volumes:
            - db-primary-data:/var/lib/mysql
            - ./docker/replication/primary-init.sh:/docker-entrypoint-initdb.d/10-replication-user.sh:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-ecommerce-root-pass}"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    mysql-replica:
        image: mysql:8.0
        container_name: ecommerce-db-replica
        command: >
            --server-id=2
            --log-bin=mysql-bin
            --gtid-mode=ON
            --enforce-gtid-consistency=ON
            --relay-log=relay-bin
        environment:
            MYSQL_DATABASE: ecommerce
            MYSQL_USER: ecommerce
            MYSQL_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-ecommerce-root-pass}"
            MYSQL_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:-ecommerce-replica-pass}"
        ports:
            - "${DB_REPLICA_PORT:-3309}:3306"
        volumes:
            - db-replica-data:/var/lib/mysql
            - ./docker/replication/replica-init.sh:/docker-entrypoint-initdb.d/10-replication-source.sh:ro
        depends_on:
            mysql-primary:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-ecommerce-root-pass}"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: ecommerce-redis
        ports:
            - "6380:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4-management
        container_name: ecommerce-rabbitmq
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-ecommerce}"
            RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-ecommerce-local-pass}"
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10
        restart: unless-stopped

    soketi:
        image: quay.io/soketi/soketi:latest-16-alpine
        container_name: ecommerce-soketi
        environment:
            SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-ecommerce-app}"
            SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-ecommerce-key}"
            SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-ecommerce-secret}"
            SOKETI_DEBUG: "1"
        ports:
            - "6001:6001"
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:latest
        container_name: ecommerce-mailpit
        ports:
            - "8025:8025"   # واجهة الويب
            - "1025:1025"   # SMTP
        restart: unless-stopped


    worker-email:
        build: .
        image: ecommerce-api
        entrypoint: ["php", "artisan", "notifications:consume-emails"]
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            LOG_CHANNEL: stderr
            CACHE_DRIVER: array
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync

            DB_CONNECTION: mysql
            DB_HOST: mysql-primary
            DB_PORT: 3306
            DB_READ_HOST: mysql-replica
            DB_READ_PORT: 3306
            DB_WRITE_HOST: mysql-primary
            DB_WRITE_PORT: 3306
            DB_DATABASE: ecommerce
            DB_USERNAME: ecommerce
            DB_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"

            <<: [*mail-env, *rabbitmq-env]
        depends_on:
            mysql-primary:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped


    relay:
        build: .
        image: ecommerce-api
        entrypoint: ["php", "artisan", "messages:relay-held", "--interval=5"]
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            LOG_CHANNEL: stderr
            CACHE_DRIVER: array
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            DB_CONNECTION: mysql
            DB_HOST: mysql-primary
            DB_PORT: 3306
            DB_READ_HOST: mysql-replica
            DB_READ_PORT: 3306
            DB_WRITE_HOST: mysql-primary
            DB_WRITE_PORT: 3306
            DB_DATABASE: ecommerce
            DB_USERNAME: ecommerce
            DB_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            <<: [*rabbitmq-env]
        depends_on:
            mysql-primary:
                condition: service_healthy
            app1:
                condition: service_started
        restart: unless-stopped

volumes:
    db-primary-data:
    db-replica-data:
    app-storage:
    rabbitmq-data:
