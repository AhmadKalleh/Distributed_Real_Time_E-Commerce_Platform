services:
    app:
        build: .
        image: ecommerce-api
        container_name: ecommerce-api
        ports:
            - "${APP_PORT:-8080}:80"
        environment:
            APP_NAME: "E-Commerce API"
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: "http://localhost:${APP_PORT:-8080}"
            APP_KEY: "${APP_KEY:-}"
            JWT_SECRET: "${JWT_SECRET:-}"
            JWT_TTL: 60
            LOG_CHANNEL: stderr
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ecommerce
            DB_USERNAME: ecommerce
            DB_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            CACHE_DRIVER: database
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            FILESYSTEM_DISK: local
            SEED_DEMO_DATA: "true"
            # Order emails: values come from the shell or the project .env file.
            MAIL_MAILER: "${MAIL_MAILER:-log}"
            MAIL_HOST: "${MAIL_HOST:-}"
            MAIL_PORT: "${MAIL_PORT:-587}"
            MAIL_USERNAME: "${MAIL_USERNAME:-}"
            MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
            MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
            MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.test}"
            MAIL_FROM_NAME: "E-Commerce Platform"
        volumes:
            - app-storage:/var/www/html/storage/app
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: mysql:8.0
        container_name: ecommerce-db
        environment:
            MYSQL_DATABASE: ecommerce
            MYSQL_USER: ecommerce
            MYSQL_PASSWORD: "${DB_PASSWORD:-ecommerce-local-pass}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-ecommerce-root-pass}"
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-ecommerce-root-pass}"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

volumes:
    db-data:
    app-storage:
