services:
  mysql-primary:
    image: mysql:8.0
    container_name: mysql-primary
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: perf_db
    ports:
      - "3308:3306"
    volumes:
      - primary_data:/var/lib/mysql

  mysql-replica:
    image: mysql:8.0
    container_name: mysql-replica
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --relay-log=relay-bin
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - replica_data:/var/lib/mysql
    depends_on:
      - mysql-primary

volumes:
  primary_data:
  replica_data:
