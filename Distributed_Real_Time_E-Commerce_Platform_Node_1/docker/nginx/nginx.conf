# موزّع الحمل: least_conn على 3 نسخ متطابقة من الـ API (كلفة الطلبات متفاوتة).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # السجل يوضح أي نسخة خدمت كل طلب (up=...) لإثبات التوزيع
    log_format lb '$remote_addr [$time_local] "$request" $status rt=$request_time up=$upstream_addr';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    upstream api_pool {
        # الطلب الجديد يذهب للنسخة الأقل طلبات نشطة. النسخة التي تفشل مرتين تُستبعد 10 ثوانٍ.
        least_conn;
        zone api_pool 64k;   # ذاكرة مشتركة بين عمليات Nginx: عدّاد الاتصالات وحالة الفشل موحّدان
        server app1:80 max_fails=2 fail_timeout=10s;
        server app2:80 max_fails=2 fail_timeout=10s;
        server app3:80 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 12m;   # نفس حد الرفع في PHP

        location / {
            proxy_pass http://api_pool;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # نسخة ميتة لا تعطّل الطلب: مهلة اتصال قصيرة ثم الانتقال للنسخة التالية
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;

            # إعادة المحاولة عند فشل الاتصال أو المهلة فقط.
            # لا نضيف http_503: ردود 503 من Laravel (المستودع) ليست عطل نسخة.
            # طلبات POST لا تُعاد بعد إرسالها (سلوك Nginx الافتراضي)، فلا يتكرر طلب شراء.
            proxy_next_upstream       error timeout;
            proxy_next_upstream_tries 3;

            add_header X-Served-By $upstream_addr always;
        }
    }
}
