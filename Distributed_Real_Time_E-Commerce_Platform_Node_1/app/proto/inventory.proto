syntax = "proto3";

package inventory.v1;

option php_namespace = "App\\Modules\\Orders\\Grpc\\Generated";
option php_metadata_namespace = "App\\Modules\\Orders\\Grpc\\Generated\\GPBMetadata";

service InventoryService {
  rpc GetProductQuantity (ProductQuantityRequest) returns (ProductQuantityResponse);
  rpc ReserveStock (ReserveStockRequest) returns (StockOperationResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (StockOperationResponse);
}

message ProductQuantityRequest {
  int64 product_id = 1;
}

message ProductQuantityResponse {
  bool found = 1;
  int64 available_quantity = 2;
}

message StockItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string reservation_reference = 1;
  repeated StockItem items = 2;
}

message ReleaseStockRequest {
  string reservation_reference = 1;
}

message StockOperationResponse {
  bool success = 1;
  string message = 2;
}
