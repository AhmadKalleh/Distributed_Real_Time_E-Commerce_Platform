openapi: 3.0.3
info:
  title: Distributed Real-Time E-Commerce Platform API
  version: 1.0.0
  description: |
    REST API for the e-commerce platform, split into four modules: **Users**, **Products**, **Orders**, **Notifications**.

    **How to try it**
    1. Call `POST /auth/login` with one of the demo accounts below.
    2. Copy `data.access_token`, click **Authorize** and paste it.
    3. Call any endpoint with **Try it out**.

    | Role | Email | Password |
    |---|---|---|
    | Responsible (admin) | `responsible@example.test` | `ChangeThisLocalPassword123!` |
    | Customer | `customer1@example.test` | `CustomerDemo123!` |
    | Customer | `customer2@example.test` | `CustomerDemo123!` |

    **Roles**
    - `Customer`: browses products, places orders, sees **only their own** orders and notifications.
    - `Responsible`: adds products, sees all orders and is the **only** role that can change an order's status.

    **Errors** always use the same envelope:
    ```json
    { "error": { "status": 403, "code": "FORBIDDEN", "message": "You are not allowed to perform this action." } }
    ```
    Validation errors (422) add `details` with the failing fields.

    **Protection**: after 5 failed logins for the same email + IP the account is locked for 5 minutes (429 with `Retry-After`);
    auth endpoints are limited to 20 requests/minute per IP; every response carries security headers.
servers:
  - url: /api/v1
tags:
  - name: Users
  - name: Products
  - name: Orders
  - name: Notifications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
    OrderId:
      name: order
      in: path
      required: true
      schema: { type: integer }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message]
          properties:
            status: { type: integer, example: 403 }
            code:
              type: string
              example: FORBIDDEN
              description: |
                One of UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, VALIDATION_ERROR,
                INVALID_CREDENTIALS, TOO_MANY_LOGIN_ATTEMPTS, TOO_MANY_REQUESTS, INSUFFICIENT_STOCK,
                INVALID_STATUS_TRANSITION, INTERNAL_ERROR.
            message: { type: string, example: You are not allowed to perform this action. }
            details:
              type: object
              additionalProperties: true
              example: { email: ["The email field is required."] }

    User:
      type: object
      properties:
        id: { type: integer, example: 2 }
        name: { type: string, example: Demo Customer One }
        email: { type: string, example: customer1@example.test }
        role: { type: string, enum: [Customer, Responsible] }
        created_at: { type: string, format: date-time }

    Token:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer, example: 3600 }
            user: { $ref: '#/components/schemas/User' }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Electronics }
        slug: { type: string, example: electronics }
        description: { type: string, nullable: true }

    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, example: "18.50" }
        stock: { type: integer, example: 50 }
        in_stock: { type: boolean }
        is_active: { type: boolean }
        category: { $ref: '#/components/schemas/Category' }
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              url: { type: string, format: uri }
        created_at: { type: string, format: date-time }

    Order:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        allowed_next_statuses:
          type: array
          items: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { type: string, example: "37.00" }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              product_name: { type: string }
              quantity: { type: integer }
              unit_price: { type: string }
              line_total: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderStatus:
      type: string
      enum: [Pending, Confirmed, Shipped, Delivered, Cancelled]
      description: "Pending → Confirmed → Shipped → Delivered; Pending/Confirmed → Cancelled (stock is returned)."

    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: order.status_changed }
        title: { type: string }
        body: { type: string }
        payload: { type: object, additionalProperties: true, description: "Event details, e.g. order_id, from, to." }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

  responses:
    Unauthenticated:
      description: Missing, invalid, expired or revoked token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { status: 401, code: UNAUTHENTICATED, message: Authentication is required. Send a valid Bearer token. } }
    Forbidden:
      description: Authenticated, but the role or ownership check failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { status: 403, code: FORBIDDEN, message: You are not allowed to perform this action. } }
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { status: 404, code: NOT_FOUND, message: The requested resource was not found. } }
    ValidationError:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { status: 422, code: VALIDATION_ERROR, message: The given data was invalid., details: { items: ["The items field is required."] } } }

paths:
  /health:
    get:
      tags: [Users]
      summary: Liveness check
      responses:
        '200': { description: OK }

  /auth/register:
    post:
      tags: [Users]
      summary: Register a new customer account
      description: Always creates a `Customer`. Any `role` field in the body is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, example: New Customer }
                email: { type: string, format: email, example: new.customer@example.test }
                password: { type: string, example: Secret123, description: "Min 8 chars, upper + lower case letters and a number." }
                password_confirmation: { type: string, example: Secret123 }
      responses:
        '201':
          description: Account created; returns a token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many requests from this IP. }

  /auth/login:
    post:
      tags: [Users]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: customer1@example.test }
                password: { type: string, example: CustomerDemo123! }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { status: 401, code: INVALID_CREDENTIALS, message: The email or password is incorrect., details: { attempts_left: 4 } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Locked after too many failed attempts.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { status: 429, code: TOO_MANY_LOGIN_ATTEMPTS, message: Too many failed login attempts. Try again in 300 seconds., details: { retry_after_seconds: 300 } } }

  /auth/me:
    get:
      tags: [Users]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [Users]
      summary: Revoke the current token
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked; it can no longer be used. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users:
    get:
      tags: [Users]
      summary: List all users (Responsible only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [Customer, Responsible] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Paginated users. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories:
    get:
      tags: [Products]
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /products:
    get:
      tags: [Products]
      summary: Browse products (filter + pagination)
      parameters:
        - name: category
          in: query
          description: Category id or slug (e.g. `electronics`).
          schema: { type: string }
        - name: search
          in: query
          description: Matches product name.
          schema: { type: string }
        - name: min_price
          in: query
          schema: { type: number }
        - name: max_price
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc, name], default: newest }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated products.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
                  - $ref: '#/components/schemas/PaginationMeta'
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products]
      summary: Add a product with images (Responsible only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category_id, name, price, stock, images]
              properties:
                category_id: { type: integer, example: 1 }
                name: { type: string, example: Mechanical Keyboard }
                description: { type: string }
                price: { type: number, example: 59.90 }
                stock: { type: integer, example: 25 }
                is_active: { type: boolean, default: true }
                images:
                  type: array
                  description: 1–5 images, jpg/png/webp, max 2 MB each.
                  items: { type: string, format: binary }
            encoding:
              images:
                style: form
                explode: true
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{product}:
    get:
      tags: [Products]
      summary: Show one product
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    get:
      tags: [Orders]
      summary: List orders (customers get only their own; Responsible gets all)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated orders.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
                  - $ref: '#/components/schemas/PaginationMeta'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Orders]
      summary: Place an order (Customer only)
      description: Prices are taken from the database. Stock is reserved atomically.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer, example: 1 }
                      quantity: { type: integer, minimum: 1, maximum: 100, example: 2 }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Not enough stock or product unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { status: 409, code: INSUFFICIENT_STOCK, message: Some items cannot be ordered., details: { items: [{ product_id: 1, reason: Only 3 left in stock., available: 3 }] } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{order}:
    get:
      tags: [Orders]
      summary: Show one order (owner or Responsible)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{order}/status:
    patch:
      tags: [Orders]
      summary: Change order status (Responsible only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invalid status or transition not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { status: 422, code: INVALID_STATUS_TRANSITION, message: Cannot change order status from Delivered to Pending., details: { current_status: Delivered, allowed: [] } } }

  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated notifications of the current user only.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                  - $ref: '#/components/schemas/PaginationMeta'
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /notifications/{notification}/read:
    patch:
      tags: [Notifications]
      summary: Mark one of my notifications as read
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notification
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
